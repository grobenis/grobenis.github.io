# =============================================================================
# 个人对 ayer 主题的覆盖配置（覆盖 themes/ayer/_config.yml 的同名项）
# -----------------------------------------------------------------------------
# 维护约定：
#   1. 想修改主题行为（menu / subtitle / cover / 打赏 / 音乐 / 评论 / etc.）
#      → 只改本文件，不要再去改 themes/ayer/_config.yml
#   2. 升级主题时（手动同步 themes/ayer/ 目录），只动 themes/ayer/ 内的文件
#      本文件不动 → 个人定制不会丢失
#   3. 如果新版主题新增了配置项且你不想用其默认 → 在本文件显式覆盖
#   4. 想恢复某项为主题默认 → 从本文件删除对应键即可（Hexo 合并规则：缺失键
#      自动回退到 themes/ayer/_config.yml）
# =============================================================================
theme: ayer
# 侧边栏菜单
menu:
  主页: /
  归档: /archives
  分类: /categories
  标签: /tags
  # 项目:
  # CSDN: https://blog.csdn.net/GuoBen_
  # 生活: https://cengshishaonian37279.lofter.com/
  关于: /about
  旅程: /project
  成果: /works
  游戏: /games
  音乐: /lyrics
  # 友链: /friends # 友链已移至「关于」页底部
  私人空间: /private
# 站点次标题和打字动效
# https://github.com/mattboldt/typed.js
subtitle:
  enable: true # 是否开启动效
  text: 曾梦想仗剑走天涯 # 显示的文字
  text2: 愿你出走半生，归来仍是少年 # 滚动播放，如果不需要可以留空
  text3: 一杯敬朝阳，一杯敬月光
  startDelay: 0 # 延迟时间
  typeSpeed: 200 # 打字速度
  loop: true # 是否循环
  backSpeed: 100 # 回退速度
  showCursor: true # 是否显示光标

# 网站图标和侧边栏logo
favicon: /images/cat.ico
logo: /images/cat.ico

# 封面配置
# enable-是否启用封面；path-封面背景图；logo-封面logo
cover:
  enable: true
  path: /images/cover1.jpg # images目录下附送多张美图，可更换
  # path: /images/earth.jpg # images目录下附送多张美图，可更换
  # path: /images/red-sky.png # images目录下附送多张美图，可更换
  logo: /images/cat.jpeg #/images/ayer.svg，如果不要直接设置成false

# 页面顶部进度条
progressBar: true

# RSS 订阅（对应 hexo-generator-feed 生成的 atom.xml）
rss: /atom.xml

# 音乐播放器（本地音频文件）
# 将音频文件放到 source/music/ 目录，并在此指定相对站点的路径
music:
  enable: true
  file: /music/zengjingdeni.mp3 # 本地音频文件路径（网易云外链仅支持免费歌曲，VIP歌曲请改用本地文件）
  autoPlay: false # 是否自动播放（现代浏览器可能会拦截自动播放）

# 文章配置
# 文章太长，截断按钮文字(在需要截断的行增加此标记：<!--more-->)
excerpt_link: 阅读更多...
# 如果你嫌每篇文章手动加more标记比较麻烦，又不想在首页全文显示，可以把excerpt_all设置成true，这样首页只会显示文章归档
excerpt_all: false

# 是否开启文章分享按钮
share_enable: true
# 国内的社交平台(If you are not in China, maybe you prefer to set:false)
share_china: true
# 文章分享文字
share_text: 分享

# 分页文字
nav_text:
  page_prev: 上一页
  page_next: 下一页
  post_prev: 上一篇
  post_next: 下一篇

# 文章页是否显示目录
toc: true

# 文章中的图片是否支持点击放大
image_viewer: true

# 是否开启字数统计(关闭请设置enable为false)
# 也可以单独在md文件里Front-matter设置`no_word_count: true`属性，来自定义关闭字数统计
word_count:
  enable: true
  # 只在文章详情显示(不在首页显示)
  only_article_visit: true

# 打赏
# 打赏type设定：0-关闭打赏； 1-文章对应的md文件里有reward:true属性，才有打赏； 2-所有文章均有打赏
reward_type: 1
# 打赏wording
reward_wording:
# 支付宝二维码图片地址，跟你设置logo的方式一样。比如：/images/alipay.jpg
alipay: /images/pay/alipay.jpg
# 微信二维码图片地址
weixin: /images/pay/wechat.jpg

# 版权声明
# 版权声明type设定：0-关闭版权声明； 1-文章对应的md文件里有copyright: true属性，才有版权声明； 2-所有文章均有版权声明
copyright_type: 1

# 是否启用搜索
# 需要安装hexo-generator-searchdb(https://github.com/theme-next/hexo-generator-searchdb)
search: true

# 评论：1、Valine(推荐)；2、Gitalk

# 1、Valine[一款快速、简洁且高效的无后端评论系统](https://github.com/xCss/Valine)
# 启用Valine必须先创建leancloud应用， 获取 id|key 填入即可
leancloud:
  enable: false # 未配置 app_id/app_key，暂关闭评论
  app_id: #
  app_key: #
# Valine配置
valine:
  enable: false # 未配置凭据，暂关闭
  verify: false # 是否启用防垃圾验证
  notify: false # 是否开启邮件提醒(https://valine.js.org/notify.html)
  avatar: mp # 头像样式(https://valine.js.org/avatar.html)
  placeholder: 给我的文章加点评论吧~ # placeholder

# 2、Gitalk(https://github.com/gitalk/gitalk)
# 启用步骤：
#   1. GitHub → Settings → Developer settings → OAuth Apps → New OAuth App
#      Homepage URL 填 https://grobenis.github.io
#      Authorization callback URL 填 https://grobenis.github.io/
#   2. 创建后拿到 Client ID / Client Secret 填入下方
#   3. 新建一个空仓库存评论（如 blog-comments），填入 repo
#   4. enable 改为 true，重新部署
gitalk:
  enable: false # 凭据就绪后改为 true
  clientID: # GitHub Application Client ID
  clientSecret: # Client Secret
  repo: blog-comments # 存放评论的仓库（需先在 GitHub 创建空仓库）
  owner: grobenis
  admin: grobenis

# GitHub Ribbons-封面右上角的forkme
github:
  # (关闭请设置为false)
  url: false

# 访问量统计（改用 Umami 自建，不蒜子已关闭）
busuanzi:
  enable: false

# Umami 自建统计
# 服务器上部署 Umami 后，把 script_url / website_id 换成实际值，并将 enable 改为 true
umami:
  enable: false # 部署完成后改为 true
  script_url: https://umami.example.com/script.js # Umami 跟踪脚本地址
  website_id: YOUR_WEBSITE_ID # Umami 站点 ID

# 友盟cnzz统计(url填js代码src链接)
cnzz:
  enable: false
  url:

# Google Analytics
google_analytics: ""
# 百度统计
baidu_analytics: ""

# 数学公式
mathjax: true

# 网站成立年份(默认为 2019，若填入年份小于当前年份，则显示为 2018-2019 类似的格式)
since: 2019

# 是否显示页脚信息(建议保留，有助于本主题的推广)
pageFooter: false

#ICP备案信息尾部显示
icp:
  enable: false
  url: https://github.com/grobenis
  text: "5211314" # 备案信息
