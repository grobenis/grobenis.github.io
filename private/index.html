<script>
    function viewer_init() {
        let pswpElement = document.querySelectorAll('.pswp')[0];
        let $imgArr = document.querySelectorAll(('.article-entry img:not(.reward-img)'))

        $imgArr.forEach(($em, i) => {
            $em.onclick = () => {
                // slider展开状态
                // todo: 这样不好，后面改成状态
                if (document.querySelector('.left-col.show')) return
                let items = []
                $imgArr.forEach(($em2, i2) => {
                    let img = $em2.getAttribute('data-idx', i2)
                    let src = $em2.getAttribute('data-target') || $em2.getAttribute('src')
                    let title = $em2.getAttribute('alt')
                    // 获得原图尺寸
                    const image = new Image()
                    image.src = src
                    items.push({
                        src: src,
                        w: image.width || $em2.width,
                        h: image.height || $em2.height,
                        title: title
                    })
                })
                var gallery = new PhotoSwipe(pswpElement, PhotoSwipeUI_Default, items, {
                    index: parseInt(i)
                });
                gallery.init()
            }
        })
    }
    viewer_init()
</script>

    <script>
    // 小牛：滚动超过封面高度后淡入（替代原返回顶部箭头），点击平滑回顶
    // 注意：本主题 body 固定视口高度，滚动发生在 main.content 容器内
    (function () {
      var mascot = document.querySelector('.site-mascot');
      if (!mascot) return;
      var scroller = document.querySelector('main.content') || window;
      function getThreshold() {
        var cover = document.querySelector('.cover');
        return cover ? cover.offsetHeight : 400;
      }
      function getScrollY() {
        return scroller === window
          ? (window.pageYOffset || document.documentElement.scrollTop)
          : scroller.scrollTop;
      }
      function onScroll() {
        mascot.classList.toggle('is-visible', getScrollY() > getThreshold());
      }
      mascot.addEventListener('click', function () {
        if (scroller === window) {
          window.scrollTo({ top: 0, behavior: 'smooth' });
        } else {
          scroller.scrollTo({ top: 0, behavior: 'smooth' });
        }
      });
      scroller.addEventListener('scroll', onScroll, { passive: true });
      window.addEventListener('resize', onScroll, { passive: true });
      onScroll();
    })();
    </script>
