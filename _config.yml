# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: 曾是少年
subtitle: ""
description: "曾梦想仗剑走天涯"
keywords: SLAM, C++, OpenCV, ROS, 算法, 机器学习, VIO, VINS, ORB-SLAM, 面试, 可穿戴
author: guoben
language: zh
timezone: Asia/Shanghai

# server:
#   port: 4000 #端口号随意，默认是4000
#   compress: true
#   header: true

# URL
## If your site is put in a subdirectory, set url as 'http://yoursite.com/child' and root as '/child/'
url: https://grobenis.github.io
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - "brainwave/brainwave.js"
  - "brainwave/brainwave.min.js"
  - "brainwave/brainwave.css"
  - "brainwave/brainwave.min.css"
  - "brainwave/brainwave-sw.js"
  # 404 页是一份自带样式与脚本的完整 HTML 文档。不跳过渲染的话，hexo 会把它
  # 当成普通 page 再套一层主题布局，产物里会出现两套 <html>/<body>、三套 <head>：
  # 既是无效 HTML，又白加载一遍主题 CSS/JS（侧边栏、播放器、pace 等）。
  - "404.html"

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ""
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
marked:
  prependRoot: true
  postAsset: true
  lazyload: true # 正文图片懒加载
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ""
  wrap: true
  hljs: false

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ""
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated 字段的来源。必须是 'mtime' | 'date' | 'empty' 之一：
##   - 'mtime'（hexo 默认）：取文件系统修改时间。CI 是全新 checkout，
##     mtime == 检出时间，于是每次部署 sitemap/atom/JSON-LD 里的“最后修改”
##     都会变成部署当天，2020 年的旧文也会显示成刚改过。
##   - 'date'：updated 恒等于文章 date，跨机器/跨 CI 完全稳定。
##   - 'empty'：没有 front-matter `updated:` 就不输出该字段。
## 这里选 'date'；若要标记某篇确实改过，在该文 front-matter 显式写 updated:。
updated_option: date

# Pagination
## Set per_page to 0 to disable pagination
per_page: 0
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: ayer

# Deployment
## Docs: https://hexo.io/docs/deployment.html
##
## 部署统一走 GitHub Actions（.github/workflows/deploy.yml）：
## push 到 source 分支后由 CI 构建 public/ 并发布到 master。
## 本地 `hexo deploy` 已停用——它和 CI 都会 force push 同一条 master，
## 谁后跑谁覆盖对方，而且本地构建产物与 CI 不一致（见下方说明）。
## 若确需临时本地部署，把下面的 deploy: 块取消注释即可。
#
# deploy:
#   type: git
#   repo: git@github-blog:grobenis/grobenis.github.io.git
#   branch: master

# hexo-blog-encrypt（私人空间页加密）
## password/abstract/message 等每页写在 front-matter 里（明文源码不入公开仓库）。
## kdf.iterations 必须 ≥ 100000，OWASP 2023 建议 ≥ 600000；插件默认 250000 偏低。
## 注意：提高迭代数会同步增加浏览器端解密耗时（PBKDF2-SHA256，约几百毫秒量级）。
encrypt:
  kdf:
    iterations: 600000

# Hexo-generator-search
search:
  path: search.xml
  field: post
  format: html

# Hexo-generator-sitemap（搜索引擎站点地图）
sitemap:
  path: sitemap.xml

# Hexo-generator-feed（RSS 订阅，与主题 rss 链接保持一致）
feed:
  type: atom
  path: atom.xml
  limit: 20
