<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="cowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#00000040"/>
    </filter>
  </defs>
  <g filter="url(#cowShadow)">
    <!-- 牛角：白色 + 黑色描边 -->
    <path d="M57 40 Q48 16 62 8 Q65 26 74 32 Z" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M143 40 Q152 16 138 8 Q135 26 126 32 Z" fill="#FFFFFF" stroke="#000000" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- 耳朵：黑外白内 -->
    <ellipse cx="36" cy="80" rx="20" ry="27" fill="#000000" transform="rotate(-18 36 80)"/>
    <ellipse cx="37" cy="82" rx="11" ry="16" fill="#FFFFFF" transform="rotate(-18 37 82)"/>
    <ellipse cx="164" cy="80" rx="20" ry="27" fill="#000000" transform="rotate(18 164 80)"/>
    <ellipse cx="163" cy="82" rx="11" ry="16" fill="#FFFFFF" transform="rotate(18 163 82)"/>
    <!-- 呆毛：黑色 -->
    <path d="M100 26 Q90 14 101 5 Q99 19 112 22 Z" fill="#000000"/>
    <!-- 头：纯黑 -->
    <circle cx="100" cy="105" r="72" fill="#000000"/>
    <!-- 白口鼻 -->
    <ellipse cx="100" cy="138" rx="34" ry="26" fill="#FFFFFF"/>
    <!-- 鼻孔：黑色 -->
    <circle cx="88" cy="141" r="4.5" fill="#000000"/>
    <circle cx="112" cy="141" r="4.5" fill="#000000"/>
    <!-- 微笑嘴：黑色 -->
    <path d="M91 151 Q100 160 109 151" stroke="#000000" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- 眼睛：白底黑瞳 -->
    <circle cx="70" cy="96" r="11" fill="#FFFFFF"/>
    <circle cx="72" cy="98" r="5.5" fill="#000000"/>
    <circle cx="74" cy="95.5" r="1.8" fill="#FFFFFF"/>
    <circle cx="130" cy="96" r="11" fill="#FFFFFF"/>
    <circle cx="132" cy="98" r="5.5" fill="#000000"/>
    <circle cx="134" cy="95.5" r="1.8" fill="#FFFFFF"/>
  </g>
</svg>