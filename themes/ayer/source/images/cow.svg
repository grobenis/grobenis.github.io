    <circle cx="74" cy="92" r="3.5" fill="#FFFFFF"/>
    <circle cx="130" cy="96" r="10" fill="#3B3B3B"/>
    <circle cx="134" cy="92" r="3.5" fill="#FFFFFF"/>
    <!-- 腮红 -->
    <ellipse cx="48" cy="115" rx="12" ry="7.5" fill="#FF9AAE" opacity="0.6"/>
    <ellipse cx="152" cy="115" rx="12" ry="7.5" fill="#FF9AAE" opacity="0.6"/>
